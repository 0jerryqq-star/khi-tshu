<script>
const ROOMNAME=r=>/^[A-Z]$/.test(r)?r+' 房':r;
function gate(){return new Promise(ok=>{let pass=false;try{pass=localStorage.getItem('khi_ok')==='1'}catch(e){}
 if(pass)return ok();const g=document.getElementById('gate');g.style.display='flex';const i=document.getElementById('pw');
 const go=()=>{if(i.value.trim()==='520'){try{localStorage.setItem('khi_ok','1')}catch(e){}g.style.display='none';ok()}else{document.getElementById('pwm').textContent='密碼不對';i.value='';i.focus()}};
 document.getElementById('pwb').onclick=go;i.addEventListener('keydown',e=>{if(e.key==='Enter')go()});setTimeout(()=>i.focus(),100)})}
(async()=>{
 await gate();
 const load=document.getElementById('loading');load.style.display='flex';
 let idx;try{idx=await (await fetch('rooms/index.json')).json()}catch(e){load.textContent='讀不到房間清單，請連網後再開一次';return}
 let R=decodeURIComponent(location.hash.slice(1));let last=null;try{last=localStorage.getItem('khi_room')}catch(e){}
 if(!idx.rooms.some(x=>x.id===R))R=idx.rooms.some(x=>x.id===last)?last:(idx.rooms.find(x=>x.id==='U')||idx.rooms[0]).id;
 try{localStorage.setItem('khi_room',R)}catch(e){}
 const sel=document.getElementById('room');sel.innerHTML=idx.rooms.map(x=>`<option value="${x.id}"${x.id===R?' selected':''}>${ROOMNAME(x.id)}（${x.n} 塊）</option>`).join('');
 sel.onchange=()=>{location.hash=sel.value;location.reload()};
 let D;try{D=await (await fetch('rooms/'+encodeURIComponent(R)+'.json')).json()}catch(e){load.textContent='讀不到這間房的資料，請連網後再開一次';return}
 load.style.display='none';document.getElementById('ttl').textContent=idx.floor+'・'+ROOMNAME(R);
 start(D);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
function start(D){
const ROOM=D.room, LSKEY='formwork3d_'+ROOM;
const SHEET={wall:['牆板','#8fb3d9'],k:['K板','#ff9a3c'],beam:['梁板','#7bd389'],deck:['頂板','#e8d36a']};
const SN={wall:'牆板',k:'K板',beam:'梁板',deck:'頂板'};
const HOW={direct:'',leader:'',near:'標籤在板外配對',stack:'疊放第二塊',ext:'延伸板',guess:'編號推測',orphan:'只有標籤沒畫板',none:'圖上無編號'};
const STRUCT_COL='#7a7f88';
const show={wall:1,k:1,beam:1,deck:1,struct:0,labels:1};
const lock={wall:0,k:0,beam:0,deck:0};
let gz=null,gzHover=-1,solid=true,seamOn=true;const boxed=new Set();let mode='view',snapOn=true,axis=2,sel=-1,match=null,clipz=1e9,multi=false;const SEL=new Set();
const cv=document.getElementById('c'),gl=cv.getContext('webgl',{antialias:true});
const lc=document.getElementById('lab'),lx=lc.getContext('2d');
const toastEl=document.getElementById('toast');let tt=0;function toast(s){toastEl.textContent=s;toastEl.style.display='block';clearTimeout(tt);tt=setTimeout(()=>toastEl.style.display='none',1600)}
const hex=h=>[parseInt(h.slice(1,3),16)/255,parseInt(h.slice(3,5),16)/255,parseInt(h.slice(5,7),16)/255];
function tri(p){const n=p.length,idx=[...Array(n).keys()],out=[];
 const cr=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);
 const inT=(q,a,b,c)=>cr(a,b,q)>=0&&cr(b,c,q)>=0&&cr(c,a,q)>=0;
 let g=0;while(idx.length>3&&g++<5000){let ok=false;
  for(let i=0;i<idx.length;i++){const ia=idx[(i+idx.length-1)%idx.length],ib=idx[i],ic=idx[(i+1)%idx.length];const a=p[ia],b=p[ib],c=p[ic];
   if(cr(a,b,c)<=0)continue;let e=true;for(const j of idx){if(j===ia||j===ib||j===ic)continue;if(inT(p[j],a,b,c)){e=false;break}}
   if(e){out.push([ia,ib,ic]);idx.splice(i,1);ok=true;break}}
  if(!ok)break}
 if(idx.length===3)out.push(idx.slice());return out}
function prism(p,z0,z1,cb){
 for(const t of tri(p)){const [a,b,c]=t.map(i=>p[i]);cb(a[0],a[1],z1,0,0,1);cb(b[0],b[1],z1,0,0,1);cb(c[0],c[1],z1,0,0,1);cb(a[0],a[1],z0,0,0,-1);cb(c[0],c[1],z0,0,0,-1);cb(b[0],b[1],z0,0,0,-1)}
 for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];let nx=b[1]-a[1],ny=-(b[0]-a[0]);const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;
  cb(a[0],a[1],z0,nx,ny,0);cb(b[0],b[1],z0,nx,ny,0);cb(b[0],b[1],z1,nx,ny,0);cb(a[0],a[1],z0,nx,ny,0);cb(b[0],b[1],z1,nx,ny,0);cb(a[0],a[1],z1,nx,ny,0)}}
function edges(p,z0,z1,arr){for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];arr.push(a[0],a[1],z0,b[0],b[1],z0,a[0],a[1],z1,b[0],b[1],z1,a[0],a[1],z0,a[0],a[1],z1)}}
// ---------- panels ----------
const PN=D.panels;
const off=PN.map(()=>[0,0,0]),scl=PN.map(()=>[1,1,1]),names=PN.map(()=>null);
const UNK=new Set(['none','guess','orphan']);
const dcode=i=>names[i]||PN[i].code;
PN.forEach(p=>{if(p.z[0]<0){p.z=[0,p.z[1]-p.z[0]]}});
PN.forEach((p,i)=>{p.code=p.code||'';const xs=p.p.map(q=>q[0]),ys=p.p.map(q=>q[1]);p.b0=[Math.min(...xs),Math.min(...ys),p.z[0]];p.b1=[Math.max(...xs),Math.max(...ys),p.z[1]];p.id=i;
 p.key=(p.code.replace('？','')+' '+p.size).toUpperCase().replace(/\s+/g,' ')});
const boxAt=(i,o,s)=>{const p=PN[i];o=o||off[i];s=s||scl[i];return [p.b0.map((v,k)=>v+o[k]),p.b0.map((v,k)=>v+(p.b1[k]-v)*s[k]+o[k])]};
const bmin=i=>boxAt(i)[0],bmax=i=>boxAt(i)[1];
function wrects(i,o){const p=PN[i],s=scl[i];o=o||off[i];const rr=p.r||[[p.b0[0],p.b0[1],p.b1[0],p.b1[1]]];
 return rr.map(r=>[p.b0[0]+(r[0]-p.b0[0])*s[0]+o[0],p.b0[1]+(r[1]-p.b0[1])*s[1]+o[1],p.b0[0]+(r[2]-p.b0[0])*s[0]+o[0],p.b0[1]+(r[3]-p.b0[1])*s[1]+o[1]])}
function collide(ids,starts,a,d){if(!solid||!d)return d;const T=2,set=new Set(ids);
 ids.forEach((i,n)=>{const st=starts[n],[mn,mx]=boxAt(i,st),ri=wrects(i,st);
  for(let j=0;j<PN.length;j++){if(set.has(j)||boxed.has(j)||!show[PN[j].s])continue;const [jm,jM]=boxAt(j);
   // quick reject in the two other axes and along a beyond reach
   let far=false;for(let k=0;k<3;k++){if(k===a)continue;if(Math.min(mx[k],jM[k])-Math.max(mn[k],jm[k])<=T){far=true;break}}if(far)continue;
   if(d>0&&jm[a]>mx[a]+d)continue;if(d<0&&jM[a]<mn[a]+d)continue;
   const rj=wrects(j);
   if(a===2){let hit=false;for(const p of ri){for(const q of rj)if(Math.min(p[2],q[2])-Math.max(p[0],q[0])>T&&Math.min(p[3],q[3])-Math.max(p[1],q[1])>T){hit=true;break}if(hit)break}
    if(!hit)continue;if(d>0&&jm[2]>=mx[2]-T)d=Math.min(d,jm[2]-mx[2]);if(d<0&&jM[2]<=mn[2]+T)d=Math.max(d,jM[2]-mn[2])}
   else{const b=1-a;for(const p of ri)for(const q of rj){if(Math.min(p[b+2],q[b+2])-Math.max(p[b],q[b])<=T)continue;
     if(d>0&&q[a]>=p[a+2]-T)d=Math.min(d,q[a]-p[a+2]);if(d<0&&q[a+2]<=p[a]+T)d=Math.max(d,q[a+2]-p[a])}}}});
 return Math.round(d)}
const dims=i=>{const [a,b]=boxAt(i);return [0,1,2].map(k=>Math.round(b[k]-a[k]))};
const ctr=i=>{const a=bmin(i),b=bmax(i);return [(a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2]};
const basePos=[],nor=[],pid=[],baseE=[];const pR=[],eR=[];
PN.forEach((p,i)=>{const st=basePos.length/3;prism(p.p,p.z[0],p.z[1],(x,y,z,a,b,c)=>{basePos.push(x,y,z);nor.push(a,b,c);pid.push(i)});pR.push([st,basePos.length/3-st]);
 const es=baseE.length/3;edges(p.p,p.z[0],p.z[1],baseE);eR.push([es,baseE.length/3-es])});
const B0=new Float32Array(basePos),E0=new Float32Array(baseE);
const POS=new Float32Array(B0),EP=new Float32Array(E0);
const NV=POS.length/3,colArr=new Float32Array(NV*4);
const spos=[],snor=[];for(const s of D.struct)prism(s.p,s.z[0],s.z[1],(x,y,z,a,b,c)=>{spos.push(x,y,z);snor.push(a,b,c)});
function mk(a,dyn){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,a instanceof Float32Array?a:new Float32Array(a),dyn?gl.DYNAMIC_DRAW:gl.STATIC_DRAW);return b}
const B={pos:mk(POS,1),nor:mk(nor),col:gl.createBuffer(),pe:mk(EP,1),spos:mk(spos),snor:mk(snor)};
const idc=new Float32Array(NV*3);for(let v=0;v<NV;v++){const k=pid[v]+1;idc[v*3]=(k&255)/255;idc[v*3+1]=((k>>8)&255)/255;idc[v*3+2]=((k>>16)&255)/255}
B.idc=mk(idc);
const FL=[[0,0],[D.w,0],[D.w,D.h],[0,D.h]];const fpos=[],fnor=[];prism(FL,-120,0,(x,y,z,a,b,c)=>{fpos.push(x,y,z);fnor.push(a,b,c)});B.fpos=mk(fpos);B.fnor=mk(fnor);
function applyOff(i){const [st,n]=pR[i],o=off[i],s=scl[i],b=PN[i].b0;for(let v=st;v<st+n;v++)for(let k=0;k<3;k++)POS[v*3+k]=b[k]+(B0[v*3+k]-b[k])*s[k]+o[k];
 gl.bindBuffer(gl.ARRAY_BUFFER,B.pos);gl.bufferSubData(gl.ARRAY_BUFFER,st*12,POS.subarray(st*3,(st+n)*3));
 const [es,en]=eR[i];for(let v=es;v<es+en;v++)for(let k=0;k<3;k++)EP[v*3+k]=b[k]+(E0[v*3+k]-b[k])*s[k]+o[k];
 gl.bindBuffer(gl.ARRAY_BUFFER,B.pe);gl.bufferSubData(gl.ARRAY_BUFFER,es*12,EP.subarray(es*3,(es+en)*3))}
// ---------- 接縫：貼合面(青) / 重疊(紅) ----------
const SB={good:gl.createBuffer(),bad:gl.createBuffer(),ng:0,nb:0};let seamStat={good:0,bad:0};
function computeSeams(){const T=2,g=[],b=[];const L=[];
 for(let i=0;i<PN.length;i++){if(boxed.has(i)||!show[PN[i].s])continue;const [mn,mx]=boxAt(i);L.push({i,mn,mx,r:wrects(i)})}
 L.sort((a,b)=>a.mn[0]-b.mn[0]);let ng=0,nb=0;
 const rectXY=(arr,x0,y0,x1,y1,z)=>arr.push(x0,y0,z,x1,y0,z,x1,y0,z,x1,y1,z,x1,y1,z,x0,y1,z,x0,y1,z,x0,y0,z);
 const rectX=(arr,x,y0,y1,z0,z1)=>arr.push(x,y0,z0,x,y1,z0,x,y1,z0,x,y1,z1,x,y1,z1,x,y0,z1,x,y0,z1,x,y0,z0);
 const rectY=(arr,y,x0,x1,z0,z1)=>arr.push(x0,y,z0,x1,y,z0,x1,y,z0,x1,y,z1,x1,y,z1,x0,y,z1,x0,y,z1,x0,y,z0);
 for(let a=0;a<L.length;a++){const A=L[a];
  for(let c=a+1;c<L.length;c++){const B=L[c];if(B.mn[0]>A.mx[0]+T)break;
   if(B.mn[1]>A.mx[1]+T||B.mx[1]<A.mn[1]-T||B.mn[2]>A.mx[2]+T||B.mx[2]<A.mn[2]-T)continue;
   const z0=Math.max(A.mn[2],B.mn[2]),z1=Math.min(A.mx[2],B.mx[2]),oz=z1-z0;
   let hit=false,bad=false;
   for(const p of A.r)for(const q of B.r){const x0=Math.max(p[0],q[0]),x1=Math.min(p[2],q[2]),y0=Math.max(p[1],q[1]),y1=Math.min(p[3],q[3]),ox=x1-x0,oy=y1-y0;
